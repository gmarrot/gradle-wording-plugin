name: "Build main branch"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"
          check-latest: true

      - name: "Validate Gradle Wrapper"
        uses: gradle/actions/wrapper-validation@v5
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v5

      - name: "Check"
        run: ./gradlew ktlintCheck check integrationTest

      - name: "Upload build reports"
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-reports
          path: |
            build/reports/
            build/test-results/
